[package]
name = "boilerplate-monotrepo"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.13.0"
dotenvy = "0.15.7"
env_logger = "0.11.10"
log = "0.4.32"
sea-orm = { version = "1.1.20", features = ["macros", "runtime-tokio-rustls", "sqlx-postgres", "debug-print"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
