[package]
name = "fevidc"
version = "0.8.8"
edition = "2024"

[dependencies]
actix-session = { version = "0.11.0", features = ["cookie-session"] }
actix-web = "4.13.0"
argon2 = "0.5.3"
dotenvy = "0.15.7"
env_logger = "0.11.10"
log = "0.4.32"
sea-orm = { version = "1.1.20", features = ["macros", "runtime-tokio-rustls", "sqlx-postgres", "debug-print"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
uuid = { version = "1.23.2", features = ["v4", "serde"] }
