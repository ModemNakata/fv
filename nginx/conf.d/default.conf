server {
    listen       80;
    listen  [::]:80;

    # listen 443 ssl;
    # listen [::]:443 ssl;

    # server_name local.test; # custom local domain for a self-signed certificate using dnsmasq

    server_name localhost;
    
    # ssl_certificate /etc/nginx/ssl/cert.crt;
    # ssl_certificate_key /etc/nginx/ssl/priv_nginx-ss.key;
    #
    # openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
	# -keyout ssl/priv_nginx-ss.key \
	# -out ssl/cert.crt


    location / {
        proxy_pass http://host.docker.internal:1929;  # Your Next.js dev server
        proxy_http_version 1.1;
        
        # Standard proxy headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Disable buffering for HMR
        proxy_buffering off;
        
        # Increase timeouts for WebSocket connections
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Specifically handle the webpack HMR endpoint (DEV SERVER)
    location /_next/webpack-hmr {
        proxy_pass http://host.docker.internal:1929/_next/webpack-hmr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://host.docker.internal:9291/;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# optional: force redirect from http to https (if using self signed cert)
